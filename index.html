<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Cornice · Spotify</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F3EE; color: #16181C;
         font: 17px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font: 400 28px/1.2 Georgia, serif; margin: 0 0 8px; }
  p { color: #6E7279; margin: 0; }
</style>
</head>
<body>
<main>
  <h1 id="titolo">Torno alla cornice…</h1>
  <p id="testo">Un attimo.</p>
</main>
<script>
  // Spotify vuole un ritorno HTTPS: questa pagina lo riceve e rimanda il telefono alla cornice in rete locale.
  // Lo state è "ip:porta.casuale" e lo ha scelto la cornice. Si accettano solo indirizzi privati, così la pagina
  // non può essere usata per mandare il codice di login su un sito esterno.
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || "";
  const m = state.match(/^(\d{1,3}(?:\.\d{1,3}){3}):(\d{2,5})\.[A-Za-z0-9_-]{8,}$/);
  const privato = m && /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(m[1]);
  const scrivi = (t, s) => { document.getElementById("titolo").textContent = t; document.getElementById("testo").textContent = s; };
  if (q.get("error")) {
    scrivi("Collegamento annullato", "Puoi chiudere questa pagina e riprovare dalla cornice.");
  } else if (!q.get("code") || !privato) {
    scrivi("Link non valido", "Riparti dal QR sulla cornice.");
  } else {
    const dest = "http://" + m[1] + ":" + m[2] + "/spotify?code=" + encodeURIComponent(q.get("code")) + "&state=" + encodeURIComponent(state);
    history.replaceState(null, "", location.pathname);
    location.replace(dest);
  }
</script>
</body>
</html>
